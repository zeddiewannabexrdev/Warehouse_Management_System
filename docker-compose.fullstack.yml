version: "3.8"

services:
  # ========================================================
  # 1. MONGODB SHARDED CLUSTER (Giữ nguyên kiến trúc gốc)
  # ========================================================
  configsvr:
    image: mongo:6.0
    container_name: vattu-configsvr
    command: mongod --configsvr --replSet configReplSet --port 27019 --bind_ip_all
    ports:
      - "27019:27019"
    volumes:
      - config_data:/data/db

  shard1:
    image: mongo:6.0
    container_name: vattu-shard1
    command: mongod --shardsvr --replSet shard1ReplSet --port 27018 --bind_ip_all
    ports:
      - "27018:27018"
    volumes:
      - shard1_data:/data/db

  shard2:
    image: mongo:6.0
    container_name: vattu-shard2
    command: mongod --shardsvr --replSet shard2ReplSet --port 27020 --bind_ip_all
    ports:
      - "27020:27020"
    volumes:
      - shard2_data:/data/db

  mongos:
    image: mongo:6.0
    container_name: vattu-mongos
    depends_on:
      - configsvr
      - shard1
      - shard2
    command: mongos --configdb configReplSet/configsvr:27019 --bind_ip_all --port 27017
    ports:
      - "27017:27017"

  # ========================================================
  # 2. APPLICATION LAYER (NESTJS BACKEND REST API)
  # ========================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vattu-backend
    restart: unless-stopped
    depends_on:
      - mongos
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - API_PREFIX=/api/v1
      - MONGODB_URI=mongodb://mongos:27017/material_inventory_db
      - DATABASE_NAME=material_inventory_db
      - JWT_SECRET=distributed_wms_secret_key_change_in_production_2026
      - JWT_EXPIRATION=1d
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ========================================================
  # 3. PRESENTATION LAYER (REACT + VITE FRONTEND NGINX)
  # ========================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vattu-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  config_data:
  shard1_data:
  shard2_data:
